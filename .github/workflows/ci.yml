name: CI Pipeline

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'

jobs:
  build-client:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y libserialport-dev doxygen lcov

      - name: Setup CMake
        uses: lukka/get-cmake@v3.23.0
      
      - name: Clone and Build Google Test
        run: |
          cd ~
          git clone https://github.com/google/googletest.git
          cd googletest
          cmake .
          make
          sudo make install

      - name: Create build directory
        run: mkdir -p clientSide/build
  
      - name: Configure CMake
        run: |
          cd clientSide/build
          cmake ..

      - name: Build client and tests using CMake
        run: |
          cd clientSide/build
          cmake --build .
          cmake --build . --target tests
          ./game_tests

      - name: Generate coverage report
        run: |
          lcov --capture --directory . --output-file coverage.info
          lcov --list coverage.info
  
      #dummy
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: clientSide/build/coverage.info

      - name: Generate client documentation
        run: |
          cd clientSide/build
          cmake --build . --target doc

      #dummy
      - name: Upload client documentation
        uses: actions/upload-artifact@v4
        with:
          name: client-docs
          path: build/docs

        
  build-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Arduino CLI
        uses: arduino/setup-arduino-cli@v1
        with:
          version: '0.19.2'

      - name: Install Arduino core for AVR boards
        run: arduino-cli core install arduino:avr

      - name: Install Doxygen
        run: sudo apt-get update && sudo apt-get install -y doxygen

      - name: Build Arduino sketch (Server)
        run: arduino-cli compile --fqbn arduino:avr:uno serverSide/serverSide.ino

      #dummy
      - name: Upload Arduino Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: arduino-build
          path: serverSide/build/

      - name: Generate server documentation
        run: |
          mkdir -p serverSide/build
          cd serverSide/build
          cmake ..
          cmake --build . --target doc

      #dummy
      - name: Upload server documentation
        uses: actions/upload-artifact@v4
        with:
          name: server-docs
          path: serverSide/build/docs
